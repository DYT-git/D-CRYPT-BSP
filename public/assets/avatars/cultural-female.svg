<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Deep Royal Plum & Velvet Canvas -->
    <linearGradient id="cultFemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16030c"/>
      <stop offset="50%" stop-color="#2d0618"/>
      <stop offset="100%" stop-color="#0f0208"/>
    </linearGradient>

    <radialGradient id="cultFemSpotlight" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#be123c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cultFemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <linearGradient id="cultFemSil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>

    <filter id="cultFemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="500" fill="url(#cultFemBg)"/>
  <rect width="400" height="500" fill="url(#cultFemSpotlight)"/>

  <g opacity="0.4" stroke="url(#cultFemGold)" stroke-width="1" fill="none">
    <circle cx="200" cy="210" r="148" stroke-dasharray="3,5"/>
    <circle cx="200" cy="210" r="140" stroke-width="0.75"/>
    <circle cx="200" cy="210" r="116" stroke-opacity="0.3"/>
  </g>

  <circle cx="200" cy="210" r="108" fill="#1f0411" stroke="url(#cultFemGold)" stroke-width="1.8" filter="url(#cultFemShadow)"/>

  <g filter="url(#cultFemShadow)">
    <circle cx="200" cy="172" r="40" fill="url(#cultFemSil)"/>
    <!-- Graceful Silhouette Contour -->
    <path d="M 126 296 C 126 235, 160 228, 186 226 L 200 236 L 214 226 C 240 228, 274 235, 274 296 Z" fill="url(#cultFemSil)"/>
    <path d="M 188 226 L 200 242 L 212 226" stroke="#1f0411" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  </g>

  <!-- Artistic Lotus / Cultural Accent (Bottom Center) -->
  <g transform="translate(200, 348)">
    <path d="M -14,-2 C -8,4 0,6 0,6 C 0,6 8,4 14,-2" fill="none" stroke="url(#cultFemGold)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="1" r="2.5" fill="url(#cultFemGold)"/>
  </g>
</svg>
