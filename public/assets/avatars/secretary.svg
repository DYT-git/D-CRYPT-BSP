<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Deep Royal Sapphire & Midnight Onyx Canvas -->
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05101a"/>
      <stop offset="50%" stop-color="#0c1d2e"/>
      <stop offset="100%" stop-color="#030910"/>
    </linearGradient>

    <radialGradient id="secSpotlight" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Polished Champagne Gold -->
    <linearGradient id="secGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <linearGradient id="secSilhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <filter id="secShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="500" fill="url(#secBg)"/>
  <rect width="400" height="500" fill="url(#secSpotlight)"/>

  <!-- Minimalist Geometric Orbit Rings -->
  <g opacity="0.4" stroke="url(#secGold)" stroke-width="1" fill="none">
    <circle cx="200" cy="210" r="148" stroke-dasharray="3,5"/>
    <circle cx="200" cy="210" r="140" stroke-width="0.75"/>
    <circle cx="200" cy="210" r="116" stroke-opacity="0.3"/>
  </g>

  <!-- Central Dignified Medallion Disk -->
  <circle cx="200" cy="210" r="108" fill="#081421" stroke="url(#secGold)" stroke-width="1.8" filter="url(#secShadow)"/>

  <!-- Clean Minimalist Executive Silhouette -->
  <g filter="url(#secShadow)">
    <circle cx="200" cy="172" r="42" fill="url(#secSilhouette)"/>
    <path d="M 124 296 C 124 232, 156 226, 185 224 L 200 236 L 215 224 C 244 226, 276 232, 276 296 Z" fill="url(#secSilhouette)"/>
    <path d="M 186 224 L 200 242 L 214 224" stroke="#081421" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  </g>

  <!-- Minimalist Quill / Seal Accent (Bottom Center) -->
  <g transform="translate(200, 348)">
    <path d="M -16,-3 C -10,3 -4,6 0,8 C 4,6 10,3 16,-3" fill="none" stroke="url(#secGold)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="url(#secGold)"/>
  </g>
</svg>
