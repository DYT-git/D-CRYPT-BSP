<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#360515"/>
      <stop offset="45%" stop-color="#660A25"/>
      <stop offset="100%" stop-color="#1F020B"/>
    </linearGradient>

    <!-- Radial Spotlight -->
    <radialGradient id="spotlightSec" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#FFDF73" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#B8860B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldBaseSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="30%" stop-color="#FFC107"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <linearGradient id="goldLightSec" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF953F"/>
      <stop offset="25%" stop-color="#FCF6BA"/>
      <stop offset="50%" stop-color="#B38728"/>
      <stop offset="75%" stop-color="#FBF5B7"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>

    <linearGradient id="silhouetteGradSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="suitGradSec" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="goldGlowSec" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFDF73" flood-opacity="0.4"/>
    </filter>

    <filter id="cardShadowSec" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGradSec)"/>
  <rect width="400" height="500" fill="url(#spotlightSec)"/>

  <!-- Subtle Alpona Motif Backdrop -->
  <g opacity="0.08" stroke="#FFE57F" stroke-width="1.5" fill="none">
    <circle cx="200" cy="180" r="140"/>
    <circle cx="200" cy="180" r="110" stroke-dasharray="6,4"/>
    <circle cx="200" cy="180" r="80"/>
    <path d="M 200,40 L 200,320 M 60,180 L 340,180 M 100,80 L 300,280 M 100,280 L 300,80"/>
  </g>

  <!-- Golden Laurel Wreath Arch -->
  <g transform="translate(200, 185) scale(0.95)" filter="url(#goldGlowSec)">
    <path d="M -115,-40 Q -140,20 -110,80 Q -80,130 0,150" fill="none" stroke="url(#goldLightSec)" stroke-width="3"/>
    <circle cx="-120" cy="-30" r="5" fill="url(#goldLightSec)"/>
    <circle cx="-135" cy="0" r="5.5" fill="url(#goldLightSec)"/>
    <circle cx="-133" cy="35" r="6" fill="url(#goldLightSec)"/>
    <circle cx="-118" cy="70" r="6.5" fill="url(#goldLightSec)"/>
    <circle cx="-90" cy="105" r="7" fill="url(#goldLightSec)"/>
    <circle cx="-50" cy="135" r="7" fill="url(#goldLightSec)"/>

    <path d="M 115,-40 Q 140,20 110,80 Q 80,130 0,150" fill="none" stroke="url(#goldLightSec)" stroke-width="3"/>
    <circle cx="120" cy="-30" r="5" fill="url(#goldLightSec)"/>
    <circle cx="135" cy="0" r="5.5" fill="url(#goldLightSec)"/>
    <circle cx="133" cy="35" r="6" fill="url(#goldLightSec)"/>
    <circle cx="118" cy="70" r="6.5" fill="url(#goldLightSec)"/>
    <circle cx="90" cy="105" r="7" fill="url(#goldLightSec)"/>
    <circle cx="50" cy="135" r="7" fill="url(#goldLightSec)"/>
  </g>

  <!-- Golden Inner Medallion Frame -->
  <circle cx="200" cy="175" r="105" fill="#160207" stroke="url(#goldLightSec)" stroke-width="3.5" filter="url(#cardShadowSec)"/>
  <circle cx="200" cy="175" r="99" fill="none" stroke="url(#goldBaseSec)" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Dignified Executive Silhouette -->
  <g id="executiveSilhouetteSec">
    <clipPath id="medallionClipSec">
      <circle cx="200" cy="175" r="97"/>
    </clipPath>

    <g clip-path="url(#medallionClipSec)">
      <!-- Torso / Traditional Attire -->
      <path d="M 115,280 C 115,225 150,215 170,212 L 175,200 L 225,200 L 230,212 C 250,215 285,225 285,280 Z" fill="url(#suitGradSec)"/>
      
      <!-- Collar & Buttons -->
      <path d="M 180,200 L 200,225 L 220,200" fill="none" stroke="url(#goldLightSec)" stroke-width="2.5"/>
      <line x1="200" y1="225" x2="200" y2="280" stroke="url(#goldLightSec)" stroke-width="2"/>
      <circle cx="200" cy="238" r="2.5" fill="url(#goldLightSec)"/>
      <circle cx="200" cy="252" r="2.5" fill="url(#goldLightSec)"/>
      <circle cx="200" cy="266" r="2.5" fill="url(#goldLightSec)"/>

      <!-- Golden Executive Sash -->
      <path d="M 140,280 L 225,205 L 245,212 L 170,280 Z" fill="url(#goldBaseSec)" opacity="0.3"/>

      <!-- Neck -->
      <rect x="187" y="172" width="26" height="32" rx="4" fill="url(#silhouetteGradSec)"/>

      <!-- Head Silhouette -->
      <ellipse cx="200" cy="148" rx="36" ry="42" fill="url(#silhouetteGradSec)"/>

      <!-- Executive Hair Silhouette -->
      <path d="M 166,146 C 164,124 176,108 200,108 C 224,108 236,124 234,146 C 231,121 219,114 200,114 C 181,114 169,121 166,146 Z" fill="#0F172A"/>

      <!-- Executive Pen / Quill Insignia Pin -->
      <g transform="translate(155, 235) rotate(-25) scale(0.6)">
        <polygon points="0,0 4,-20 0,-25 -4,-20" fill="url(#goldLightSec)"/>
        <line x1="0" y1="0" x2="0" y2="5" stroke="url(#goldLightSec)" stroke-width="1.5"/>
      </g>
    </g>
  </g>

  <!-- Top Quill & Laurel Insignia -->
  <g transform="translate(200, 52) scale(0.85)" filter="url(#goldGlowSec)">
    <polygon points="0,-16 5,-4 18,-4 8,4 12,16 0,8 -12,16 -8,4 -18,-4 -5,-4" fill="url(#goldLightSec)"/>
    <circle cx="-26" cy="0" r="3.5" fill="url(#goldLightSec)"/>
    <circle cx="26" cy="0" r="3.5" fill="url(#goldLightSec)"/>
  </g>

  <!-- Formal Title Plaque / Ribbon at Bottom -->
  <g transform="translate(200, 365)" filter="url(#cardShadowSec)">
    <rect x="-150" y="0" width="300" height="74" rx="37" fill="#160207" stroke="url(#goldLightSec)" stroke-width="2.5"/>
    <rect x="-144" y="4" width="288" height="66" rx="33" fill="none" stroke="url(#goldBaseSec)" stroke-width="1" stroke-dasharray="4,2"/>

    <circle cx="-130" cy="37" r="5" fill="url(#goldLightSec)"/>
    <circle cx="130" cy="37" r="5" fill="url(#goldLightSec)"/>

    <!-- Bengali Title -->
    <text x="0" y="36" font-family="'Noto Sans Bengali', 'Hind Siliguri', 'Mukti', sans-serif" font-size="24" font-weight="900" fill="url(#goldLightSec)" text-anchor="middle" letter-spacing="1">
      সম্পাদক
    </text>

    <!-- English Subtitle -->
    <text x="0" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFE57F" text-anchor="middle" letter-spacing="3.5">
      GENERAL SECRETARY
    </text>
  </g>

  <!-- Official Authority Ribbon Footer -->
  <g transform="translate(200, 468)">
    <text x="0" y="0" font-family="'Noto Sans Bengali', sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" text-anchor="middle" opacity="0.8" letter-spacing="1.5">
      বাঁশদ্রোণী সোনালী পার্ক শারদ উৎসব ২০২৬
    </text>
    <text x="0" y="14" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="url(#goldLightSec)" text-anchor="middle" letter-spacing="2">
      EXECUTIVE COUNCIL • OFFICIAL SEAL
    </text>
  </g>
</svg>
