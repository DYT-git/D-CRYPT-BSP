<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="clubBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="clubSpotlight" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#ea580c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clubAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#clubBgGrad)"/>
  <rect width="400" height="500" fill="url(#clubSpotlight)"/>

  <!-- Energy / Sport & Cultural Ring Graphics -->
  <g opacity="0.18" stroke="#f59e0b" stroke-width="1.5" fill="none">
    <circle cx="200" cy="180" r="130"/>
    <circle cx="200" cy="180" r="105" stroke-dasharray="6,4"/>
    <circle cx="200" cy="180" r="80" stroke-opacity="0.5"/>
  </g>

  <!-- Silhouette -->
  <circle cx="200" cy="155" r="54" fill="#f1f5f9"/>
  <path d="M 115 325 C 115 230, 285 230, 285 325 Z" fill="#f8fafc"/>
  <path d="M 135 325 C 135 248, 265 248, 265 325 Z" fill="#1e1b4b"/>

  <!-- Club Crest Emblem -->
  <circle cx="200" cy="285" r="32" fill="url(#clubAmber)" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Star & Torch Icon -->
  <path d="M 200 268 L 204 278 L 215 280 L 207 288 L 209 299 L 200 293 L 191 299 L 193 288 L 185 280 L 196 278 Z" fill="#1e1b4b"/>

  <!-- Modern Banner -->
  <rect x="50" y="410" width="300" height="44" rx="22" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="200" y="438" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5" fill="#fde68a">CLUB EXECUTIVE MEMBER</text>
</svg>
