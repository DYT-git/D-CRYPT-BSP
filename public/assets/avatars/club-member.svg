<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  <rect width="400" height="500" fill="url(#spotlight)"/>
  <g opacity="0.1" stroke="#F59E0B" stroke-width="1.5" fill="none">
    <circle cx="200" cy="180" r="130"/>
    <circle cx="200" cy="180" r="105" stroke-dasharray="6,4"/>
  </g>
  <circle cx="200" cy="160" r="55" fill="#E2E8F0"/>
  <path d="M 120 320 C 120 230, 280 230, 280 320 Z" fill="#F1F5F9"/>
  <path d="M 140 320 C 140 250, 260 250, 260 320 Z" fill="#1E293B"/>
  <!-- Emblem Badge -->
  <circle cx="200" cy="290" r="34" fill="url(#amber)" stroke="#FFFFFF" stroke-width="2"/>
  <text x="200" y="298" text-anchor="middle" font-size="24" fill="#111827">⭐</text>
  <!-- Banner -->
  <rect x="50" y="410" width="300" height="44" rx="22" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="200" y="438" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#FDE68A">EXECUTIVE MEMBER</text>
</svg>
