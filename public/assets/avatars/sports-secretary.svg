<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Deep Warm Bronze & Obsidian Canvas -->
    <linearGradient id="sportSecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140c03"/>
      <stop offset="50%" stop-color="#2a1705"/>
      <stop offset="100%" stop-color="#0a0501"/>
    </linearGradient>

    <radialGradient id="sportSecSpotlight" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sportSecGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <linearGradient id="sportSecSil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>

    <filter id="sportSecShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="500" fill="url(#sportSecBg)"/>
  <rect width="400" height="500" fill="url(#sportSecSpotlight)"/>

  <g opacity="0.4" stroke="url(#sportSecGold)" stroke-width="1" fill="none">
    <circle cx="200" cy="210" r="148" stroke-dasharray="3,5"/>
    <circle cx="200" cy="210" r="140" stroke-width="0.75"/>
    <circle cx="200" cy="210" r="116" stroke-opacity="0.3"/>
  </g>

  <circle cx="200" cy="210" r="108" fill="#1c0f04" stroke="url(#sportSecGold)" stroke-width="1.8" filter="url(#sportSecShadow)"/>

  <g filter="url(#sportSecShadow)">
    <circle cx="200" cy="172" r="42" fill="url(#sportSecSil)"/>
    <path d="M 124 296 C 124 232, 156 226, 185 224 L 200 236 L 215 224 C 244 226, 276 232, 276 296 Z" fill="url(#sportSecSil)"/>
    <path d="M 186 224 L 200 242 L 214 224" stroke="#1c0f04" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  </g>

  <!-- Athletic Torch / Laurel Emblem (Bottom Center) -->
  <g transform="translate(200, 348)">
    <path d="M -16,-3 C -10,3 -4,6 0,8 C 4,6 10,3 16,-3" fill="none" stroke="url(#sportSecGold)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="url(#sportSecGold)"/>
  </g>
</svg>
