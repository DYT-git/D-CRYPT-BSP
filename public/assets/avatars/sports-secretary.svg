<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="50%" stop-color="#0F1E36"/>
      <stop offset="100%" stop-color="#080E1A"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  <rect width="400" height="500" fill="url(#spotlight)"/>
  <g opacity="0.12" stroke="#F59E0B" stroke-width="1.5" fill="none">
    <circle cx="200" cy="180" r="130"/>
    <circle cx="200" cy="180" r="105" stroke-dasharray="6,4"/>
    <path d="M 100 180 L 300 180 M 200 80 L 200 280" stroke-width="1"/>
  </g>
  <!-- Silhouette & Sports Crest -->
  <circle cx="200" cy="160" r="55" fill="#CBD5E1"/>
  <path d="M 120 320 C 120 230, 280 230, 280 320 Z" fill="#E2E8F0"/>
  <path d="M 140 320 C 140 250, 260 250, 260 320 Z" fill="#1E293B"/>
  <!-- Trophy Badge -->
  <circle cx="200" cy="290" r="34" fill="url(#gold)" stroke="#FFFFFF" stroke-width="2"/>
  <text x="200" y="298" text-anchor="middle" font-size="24" fill="#1E3A5F">🏆</text>
  <!-- Banner -->
  <rect x="50" y="410" width="300" height="44" rx="22" fill="#0F1E36" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="200" y="438" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#FDE68A">SPORTS &amp; ATHLETICS</text>
</svg>
