<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="50%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#0F0520"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#E11D48" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  <rect width="400" height="500" fill="url(#spotlight)"/>
  <g opacity="0.12" stroke="#FDA4AF" stroke-width="1.5" fill="none">
    <circle cx="200" cy="180" r="130"/>
    <circle cx="200" cy="180" r="105" stroke-dasharray="6,4"/>
  </g>
  <circle cx="200" cy="160" r="55" fill="#F1F5F9"/>
  <path d="M 120 320 C 120 230, 280 230, 280 320 Z" fill="#F8FAFC"/>
  <path d="M 140 320 C 140 250, 260 250, 260 320 Z" fill="#3B0764"/>
  <!-- Music / Art Badge -->
  <circle cx="200" cy="290" r="34" fill="url(#roseGold)" stroke="#FFFFFF" stroke-width="2"/>
  <text x="200" y="298" text-anchor="middle" font-size="24" fill="#FFFFFF">🎭</text>
  <!-- Banner -->
  <rect x="50" y="410" width="300" height="44" rx="22" fill="#2E1065" stroke="#FDA4AF" stroke-width="1.5"/>
  <text x="200" y="438" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#FBCFE8">CULTURAL &amp; ARTS</text>
</svg>
