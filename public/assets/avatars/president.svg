<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Deep Royal Onyx & Crimson Velvet Canvas -->
    <linearGradient id="presBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140207"/>
      <stop offset="50%" stop-color="#2a0611"/>
      <stop offset="100%" stop-color="#0e0104"/>
    </linearGradient>

    <!-- Warm Golden Ambient Spotlight -->
    <radialGradient id="presSpotlight" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Polished Imperial Gold Gradient -->
    <linearGradient id="presGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Refined Silhouette Fill -->
    <linearGradient id="presSilhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <filter id="presShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="500" fill="url(#presBg)"/>
  <rect width="400" height="500" fill="url(#presSpotlight)"/>

  <!-- Minimalist Geometric Orbit Rings -->
  <g opacity="0.45" stroke="url(#presGold)" stroke-width="1" fill="none">
    <circle cx="200" cy="210" r="150" stroke-dasharray="3,6"/>
    <circle cx="200" cy="210" r="142" stroke-width="0.75"/>
    <circle cx="200" cy="210" r="118" stroke-opacity="0.3"/>
  </g>

  <!-- Central Dignified Medallion Disk -->
  <circle cx="200" cy="210" r="110" fill="#1b040a" stroke="url(#presGold)" stroke-width="2" filter="url(#presShadow)"/>

  <!-- Clean Minimalist Executive Silhouette -->
  <g filter="url(#presShadow)">
    <!-- Head -->
    <circle cx="200" cy="170" r="42" fill="url(#presSilhouette)"/>
    
    <!-- Torso / Shoulders with Clean Ergonomic Arc -->
    <path d="M 122 296 C 122 232, 154 225, 184 223 L 200 236 L 216 223 C 246 225, 278 232, 278 296 Z" fill="url(#presSilhouette)"/>

    <!-- Subtle Nehru / Tie Collar Accent -->
    <path d="M 185 223 L 200 242 L 215 223" stroke="#1b040a" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  </g>

  <!-- Delicate Gold Laurel Wreath Accent (Bottom Center) -->
  <g transform="translate(200, 350)">
    <path d="M -24,-6 C -16,6 -8,12 0,14 C 8,12 16,6 24,-6" fill="none" stroke="url(#presGold)" stroke-width="1.75" stroke-linecap="round"/>
    <circle cx="0" cy="4" r="3.5" fill="url(#presGold)"/>
    <circle cx="-16" cy="-1" r="2" fill="url(#presGold)"/>
    <circle cx="16" cy="-1" r="2" fill="url(#presGold)"/>
  </g>
</svg>
